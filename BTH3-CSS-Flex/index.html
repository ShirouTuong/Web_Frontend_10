<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS | flex-grow Property</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            height: 120px;
            gap: 10px;
            background-color: #f0f0f0;
            border: 2px solid #333;
            padding: 10px;
        }

        .item {
            padding: 20px;
            background-color: lightlightblue;
            background-color: #87ceeb;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
 
            flex-grow: 0;
        }

        .item:nth-child(2) {
            flex-grow: 1;
            background-color: #ff7f50; 
            color: white;
        }
    </style>
</head>
<body>

    <h2>Ví dụ thực hành flex-grow với 5 Flex Item</h2>
    <br>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2 (flex-grow: 1)</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>

</body>
</html>
