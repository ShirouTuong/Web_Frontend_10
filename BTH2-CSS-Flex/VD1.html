<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ 1: flex-basis với px</title>
    <style>
        .container {
            display: flex;
            gap: 10px;
        }

        .item {
            padding: 20px;
            background-color: lightblue;
        }

        .item1 {
            flex-basis: 200px;
        }

        .item2 {
            flex-basis: 100px;
        }

        .item3 {
            flex-basis: 150px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div>
    </div>

</body>
</html>
