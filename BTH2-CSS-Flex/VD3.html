<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ 3: flex-basis với %</title>
    <style>
        .container {
            display: flex;
            gap: 10px;
        }

        .item {
            flex-basis: 50%;
            padding: 20px;
            background-color: lightcoral;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
    </div>

</body>
</html>
