<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ 2: flex-basis với flex-direction</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 500px;
        }

        .item {
            flex-basis: 100px;
            padding: 20px;
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

</body>
</html>
