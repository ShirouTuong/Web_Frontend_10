<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ flex-wrap</title>
    <style>
        .container {
            display: flex;
            flex-wrap: initial;
            width: 600px;
            height: 300px;
            gap: 10px;
            border: 2px solid black;
        }

        .item {
            width: 180px;
            height: 80px;
            padding: 20px;
            background-color: lightblue;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>
</html>
