<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ 1: flex-flow: row nowrap</title>
    <style>
        .container-1 {
            display: flex;
            flex-flow: row nowrap;
            background-color: #f1f1f1;
        }

        .container-1 > div {
            background-color: #007bff;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>

    <div class="container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>
</html>
